# Netlify build settings for the wedding site.
#
# The site is a static export (see next.config.mjs), so there is no Next.js
# runtime to install — Netlify just publishes the folder `next build` writes.

[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Long-lived caching for the hashed bundles. Their filenames change whenever
# their contents do, so there is never a stale copy to worry about.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The moderation page is unlisted, not secret — but there is no reason to let a
# search engine put it in an index. The real protection is the token check on
# the API; this just keeps it out of results. Set as a header rather than in
# robots.txt, because a robots.txt entry would itself advertise the path.
[[headers]]
  for = "/secret-page/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[headers]]
  for = "/secret-page"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
